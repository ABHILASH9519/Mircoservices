<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc">
<title id="title">Project Relay transaction event flow</title>
<desc id="desc">Order events enter the API and persist in a relay database. A worker claims deliveries and sends signed messages to separate inventory and fulfillment application inboxes. Each app returns a durable receipt.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#83b7d7"/></marker>
  <style>
    text{font-family:system-ui,sans-serif;fill:#f8fbff}.title{font-size:28px;font-weight:700}.subtitle{font-size:14px;fill:#a4b9d0}.label{font-size:17px;font-weight:650}.small{font-size:13px;fill:#b6c8dc}.card{fill:#142944;stroke:#375572;stroke-width:1.5}.path{fill:none;stroke:#83b7d7;stroke-width:2;marker-end:url(#arrow)}.pulse{fill:none;stroke:#52e0c0;stroke-width:3;stroke-dasharray:6 40;animation:flow 1.8s linear infinite}@keyframes flow{to{stroke-dashoffset:-92}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
  </style>
</defs>
<rect width="1000" height="480" rx="20" fill="#0b1829"/>
<text x="30" y="44" class="title">Project Relay</text>
<text x="30" y="69" class="subtitle">CROSS-APPLICATION TRANSACTION NETWORK</text>
<rect x="30" y="96" width="940" height="324" rx="16" fill="#0f2136" stroke="#284360"/>
<g class="card">
 <rect x="54" y="191" width="146" height="70" rx="10"/>
 <rect x="242" y="191" width="155" height="70" rx="10"/>
 <rect x="242" y="315" width="155" height="66" rx="10"/>
 <rect x="449" y="191" width="155" height="70" rx="10"/>
 <rect x="669" y="136" width="145" height="70" rx="10"/>
 <rect x="669" y="268" width="145" height="70" rx="10"/>
 <rect x="853" y="136" width="93" height="70" rx="10"/>
 <rect x="853" y="268" width="93" height="70" rx="10"/>
</g>
<g text-anchor="middle">
 <text x="127" y="218" class="label">Orders</text><text x="127" y="239" class="small">Event producer</text>
 <text x="319" y="218" class="label">Relay API</text><text x="319" y="239" class="small">Validate + accept</text>
 <text x="319" y="341" class="label">Relay DB</text><text x="319" y="362" class="small">Event + outbox</text>
 <text x="526" y="218" class="label">Worker</text><text x="526" y="239" class="small">Claim + sign + retry</text>
 <text x="741" y="162" class="label">Inventory</text><text x="741" y="183" class="small">Receives event</text>
 <text x="741" y="294" class="label">Fulfillment</text><text x="741" y="315" class="small">Receives event</text>
 <text x="899" y="164" class="label" font-size="15">Inbox</text><text x="899" y="184" class="small">SQLite</text>
 <text x="899" y="296" class="label" font-size="15">Inbox</text><text x="899" y="316" class="small">SQLite</text>
</g>
<g class="path">
 <path d="M200 226H242"/><path d="M319 261V315"/><path d="M397 348H526V261"/>
 <path d="M604 211H633V171H669"/><path d="M604 241H633V303H669"/>
 <path d="M814 171H853"/><path d="M814 303H853"/>
</g>
<g class="pulse"><path d="M200 226H242M319 261V315M397 348H526V261M604 211H633V171H669M604 241H633V303H669M814 171H853M814 303H853"/></g>
<text x="54" y="401" class="small">HTTP acceptance → durable claim → signed delivery → idempotent receipt</text>
<text x="30" y="451" class="subtitle">Illustrated architecture · four Compose services · independent receiving application storage</text>
</svg>
