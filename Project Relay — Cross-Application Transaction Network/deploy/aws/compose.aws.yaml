# Overlay only when launching on the dedicated AWS host.
x-cloud-service: &cloud-service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  relay-api:
    <<: *cloud-service
  relay-worker:
    <<: *cloud-service
  inventory:
    <<: *cloud-service
    healthcheck: &inbox-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  fulfillment:
    <<: *cloud-service
    healthcheck: *inbox-health
